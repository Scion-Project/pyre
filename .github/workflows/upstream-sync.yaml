# Weekly check for new commits on upstream ChefKissInc/Inferno (dev and master).
# For each upstream branch that has commits our master lacks, it pushes the
# upstream tip to `upstream-sync/<branch>` and opens (or refreshes) a PR that
# merges it into master. A trial merge runs first; on conflicts the PR is still
# opened, with the conflicting files listed in its body so they can be resolved
# locally. Nothing is ever merged automatically.
#
# Dry run (no push, no PR, just the report in the job summary): the
# workflow_dispatch `dry_run` input, and every PR that edits this file.
#
# Repo settings / secrets:
#   * "Allow GitHub Actions to create and approve pull requests" must be on
#     (Settings > Actions > General) for the default GITHUB_TOKEN to open PRs.
#   * Optional secret SYNC_TOKEN (a PAT with repo + workflow scope). Without
#     it, GITHUB_TOKEN is used, which means (a) PRs it opens do not trigger the
#     other workflows (android/build), and (b) pushes are refused when the new
#     upstream commits touch .github/workflows/. A PAT avoids both.

name: upstream-sync

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only; do not push branches or open PRs
        type: boolean
        default: false
  pull_request:
    branches: [master]
    paths: [.github/workflows/upstream-sync.yaml]

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/ChefKissInc/Inferno.git
  # Checked in order. A later branch is skipped when all of its new commits
  # are already covered by an earlier one (upstream master is usually an
  # ancestor of dev), so one PR is opened instead of two overlapping ones.
  UPSTREAM_BRANCHES: dev master
  BASE: master
  DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && 'true' || 'false' }}

jobs:
  sync:
    # Never push or open PRs from forks of this fork.
    if: github.repository == 'Scion-Project/pyre'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          for b in $UPSTREAM_BRANCHES; do
            git fetch --no-tags upstream "+refs/heads/$b:refs/remotes/upstream/$b"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          summary() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          base="origin/$BASE"
          covered=()   # upstream refs already handled earlier in this run
          summary "## Upstream sync ($UPSTREAM_URL -> $BASE)"
          summary ""
          [[ "$DRY_RUN" == true ]] && summary "_Dry run: no branches pushed, no PRs opened._" && summary ""

          for b in $UPSTREAM_BRANCHES; do
            up="upstream/$b"
            tip="$(git rev-parse "$up")"
            new="$(git rev-list --count "$base..$up" ${covered[@]+"${covered[@]/#/^}"})"
            covered+=("$up")
            if [[ "$new" -eq 0 ]]; then
              summary "- \`$b\` (${tip:0:12}): nothing to sync, every upstream commit is already in $BASE."
              continue
            fi
            total="$(git rev-list --count "$base..$up")"

            # Trial merge on a detached base to find conflicts.
            git checkout -q --detach "$base"
            conflicts=""
            if ! git merge --no-commit --no-ff -q "$up" >/dev/null 2>&1; then
              conflicts="$(git diff --name-only --diff-filter=U)"
            fi
            git merge --abort 2>/dev/null || git reset -q --hard
            git checkout -q --detach "$base"

            head="upstream-sync/$b"
            body="$RUNNER_TEMP/body-$b.md"
            {
              echo "Automated sync of upstream [ChefKissInc/Inferno \`$b\`](https://github.com/ChefKissInc/Inferno/tree/$b) into \`$BASE\`."
              echo
              echo "- upstream tip: ChefKissInc/Inferno@$tip"
              echo "- commits not yet in \`$BASE\`: $total"
              echo "- generated by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              if [[ -n "$conflicts" ]]; then
                echo "### Merge conflicts"
                echo
                echo "A trial merge into \`$BASE\` conflicts in:"
                echo
                echo "$conflicts" | sed 's/^/- `/; s/$/`/'
                echo
                echo "Resolve locally (\`git fetch origin && git checkout $BASE && git merge origin/$head\`), then push the resolved merge to $BASE or a new branch. Do not merge this PR with conflicts unresolved."
              else
                echo "A trial merge into \`$BASE\` applies cleanly. Merge with a merge commit (not squash/rebase), so upstream history stays intact."
              fi
              echo
              echo "<details><summary>New commits</summary>"
              echo
              # -n, not `| head`: head exiting early would SIGPIPE git under pipefail.
              git log -n 200 --no-merges --format='- %h %s (%an)' "$base..$up"
              [[ "$total" -gt 200 ]] && echo "- ... (list truncated to 200)"
              echo
              echo "</details>"
            } > "$body"

            if [[ -n "$conflicts" ]]; then
              summary "- \`$b\` (${tip:0:12}): $total new commit(s), **conflicts** in $(echo "$conflicts" | wc -l | tr -d ' ') file(s)."
            else
              summary "- \`$b\` (${tip:0:12}): $total new commit(s), merges cleanly."
            fi
            [[ "$DRY_RUN" == true ]] && continue

            # upstream-sync/* is a bot-owned mirror of the upstream tip, so it
            # is overwritten each run (upstream may have rewritten history).
            git push --force origin "$tip:refs/heads/$head"

            pr="$(gh pr list --head "$head" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
            title="Sync upstream ChefKissInc/Inferno $b ($total commit(s))"
            [[ -n "$conflicts" ]] && title="$title [conflicts]"
            if [[ -n "$pr" ]]; then
              gh pr edit "$pr" --title "$title" --body-file "$body"
              summary "  - updated PR #$pr"
            else
              url="$(gh pr create --base "$BASE" --head "$head" --title "$title" --body-file "$body")" || {
                echo "::error::Could not open the PR. Is 'Allow GitHub Actions to create and approve pull requests' enabled? Branch pushed: $head"
                exit 1
              }
              summary "  - opened $url"
            fi
          done
